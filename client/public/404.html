<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      const base = "/digital-garden";
      const route = location.pathname.startsWith(`${base}/`)
        ? location.pathname.slice(base.length).replace(/\/$/, "") || "/"
        : "/";
      const destination = `${base}/?__route=${encodeURIComponent(route + location.search + location.hash)}`;
      location.replace(destination);
    </script>
  </head>
  <body></body>
</html>
